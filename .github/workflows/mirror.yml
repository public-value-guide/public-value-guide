# Mirror main (and tags) from GitHub to Codeberg and GitLab on every push.
#
# GitHub is the source of truth. The mirrors are fast-forward only: a push that
# cannot fast-forward a mirror fails loudly rather than overwriting it.
#
# Requires, on each mirror, the public half of the MIRROR_SSH_KEY pair added as a
# deploy key with write access (Codeberg: Settings -> Deploy Keys; GitLab:
# Settings -> Repository -> Deploy keys, "Grant write permissions"). The private
# half is the MIRROR_SSH_KEY repository secret.

name: Mirror

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        remote:
          - host: codeberg.org
            url: git@codeberg.org:public-value-guide/public-value-guide.git
          - host: gitlab.com
            url: git@gitlab.com:public-value-guide/public-value-guide.git
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the deploy key
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519,rsa ${{ matrix.remote.host }} >> ~/.ssh/known_hosts

      - name: Push main and tags
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        run: |
          git push "${{ matrix.remote.url }}" HEAD:refs/heads/main
          git push "${{ matrix.remote.url }}" --tags
